#human-feedback-v3 .hf-arena[data-tool=glove][data-side=right]:is([data-phase=swing],[data-phase=impact]) .hf-hand-right{transform:translate(-12%,-82%) rotate(-28deg) scale(.84);transition-duration:var(--hf-swing-ms)}

#human-feedback-v3 .hf-blood-spray i{position:absolute;display:block;width:6px;height:9px;background:#a52522;border-radius:55% 45% 40% 60%;box-shadow:1px 1px 1px #461713;opacity:0;--dx:-68px;--dy:-45px;--rot:-60deg}

#human-feedback-v3 .hf-blood-spray i:nth-child(4){--dx:88px;--dy:38px;--rot:95deg}

#human-feedback-v3 .hf-blood-spray i:nth-child(6){--dx:37px;--dy:-66px;--rot:55deg}

#human-feedback-v3 .hf-blood-spray i:nth-child(9){--dx:-13px;--dy:101px;--rot:145deg}
#human-feedback-v3 .hf-blood-spray i:nth-child(10){--dx:13px;--dy:-91px;--rot:-120deg}

#human-feedback-v3 .hf-blood-spray[data-severity=&quot;5&quot;] i{width:9px;height:12px}
